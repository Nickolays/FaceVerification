version: '3.9'
services:
  app:
    build:
      context: ..
      dockerfile: deploy-gpu/Dockerfile
    ports:
      - "${PORT}:8000"
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    restart: on-failure